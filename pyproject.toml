[project]
name = "privacy-form-filler"
version = "0.1.0"
description = "Privacy-preserving AI document automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "pydantic-settings",
    "python-multipart",
    "jsonschema",
    "pymupdf",
    "pytesseract",
    "pillow",
    "google-genai",
    "pycryptodome>=3.23.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "requires_tesseract: test asserts real OCR output and needs the tesseract binary installed",
]

[[tool.mypy.overrides]]
# Neither library publishes type stubs or a py.typed marker.
module = ["fitz", "pytesseract"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["app", "eval"]
